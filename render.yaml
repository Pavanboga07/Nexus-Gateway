services:
  - type: web
    name: nexus-gateway
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: GATEWAY_HOST
        value: "0.0.0.0"
      - key: GATEWAY_LOG_LEVEL
        value: "INFO"
      - key: RELAY_DATABASE_URL
        sync: false

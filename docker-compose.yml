services:
  gateway_db:
    image: postgres:16-alpine
    container_name: nexus_gateway_postgres
    environment:
      POSTGRES_USER: nexus_gateway
      # No default password is committed: compose fails loudly unless
      # POSTGRES_PASSWORD is set in the environment (or a .env file).
      # This value is dev-only — never reuse it for a real deployment.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment (dev-only value; see .env.example)}
      POSTGRES_DB: nexus_gateway
    ports:
      - "5434:5432"
    volumes:
      - gateway_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_gateway -d nexus_gateway"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build: .
    container_name: nexus_gateway
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      PORT: "9000"
      RELAY_DATABASE_URL: "postgresql+asyncpg://nexus_gateway:${POSTGRES_PASSWORD}@gateway_db:5432/nexus_gateway"
      RELAY_LOG_LEVEL: "INFO"
    depends_on:
      gateway_db:
        condition: service_healthy

volumes:
  gateway_pgdata:
